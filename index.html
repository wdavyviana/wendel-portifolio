<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Wendel Davy Viana — tráfego pago, automação, IA e desenvolvimento web para empresas que querem crescer sem montar um time inteiro." />
    <title>Wendel Davy Viana — Tráfego, Automação & IA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
 
    <!--
      Formulário estático invisível, só para o Netlify detectar os campos
      durante o build (o app é uma SPA, então o form "real" só existe depois
      que o React renderiza, e o robô do Netlify não enxerga isso).
      Os campos abaixo têm que bater exatamente com os do Contact.jsx.
    -->
    <form name="contato" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="Email" />
      <input type="text" name="Created" />
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
